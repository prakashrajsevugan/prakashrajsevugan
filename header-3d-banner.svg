<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="100%" stop-color="#0b1023"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Perspective grid floor -->
  <g stroke="url(#gridFade)" stroke-width="1.2" opacity="0.8">
    <!-- horizontal lines converging -->
    <line x1="600" y1="150" x2="0" y2="300"/>
    <line x1="600" y1="150" x2="120" y2="300"/>
    <line x1="600" y1="150" x2="260" y2="300"/>
    <line x1="600" y1="150" x2="420" y2="300"/>
    <line x1="600" y1="150" x2="600" y2="300"/>
    <line x1="600" y1="150" x2="780" y2="300"/>
    <line x1="600" y1="150" x2="940" y2="300"/>
    <line x1="600" y1="150" x2="1080" y2="300"/>
    <line x1="600" y1="150" x2="1200" y2="300"/>
    <!-- receding horizontals -->
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="140" y1="255" x2="1060" y2="255"/>
    <line x1="250" y1="220" x2="950" y2="220"/>
    <line x1="340" y1="195" x2="860" y2="195"/>
    <line x1="420" y1="175" x2="780" y2="175"/>
    <line x1="480" y1="160" x2="720" y2="160"/>

    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 18; 0 0" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- Floating particles -->
  <g fill="#60A5FA">
    <circle cx="150" cy="80" r="2.5" opacity="0.8">
      <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="50" r="1.8" opacity="0.6">
      <animate attributeName="cy" values="50;35;50" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="70" r="2" opacity="0.7">
      <animate attributeName="cy" values="70;90;70" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="40" r="2.6" opacity="0.9">
      <animate attributeName="cy" values="40;60;40" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="30" r="1.5" opacity="0.5">
      <animate attributeName="cy" values="30;45;30" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="90" r="2.2" opacity="0.75">
      <animate attributeName="cy" values="90;70;90" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Rotating wireframe cube (right side) -->
  <g transform="translate(1040,110)">
    <g stroke="#93C5FD" stroke-width="1.6" fill="none" opacity="0.9">
      <polygon points="-35,-35 35,-35 35,35 -35,35"/>
      <polygon points="-20,-50 50,-50 50,20 -20,20" opacity="0.6"/>
      <line x1="-35" y1="-35" x2="-20" y2="-50"/>
      <line x1="35" y1="-35" x2="50" y2="-50"/>
      <line x1="35" y1="35" x2="50" y2="20"/>
      <line x1="-35" y1="35" x2="-20" y2="20"/>
      <animateTransform attributeName="transform" type="rotate"
        values="0 0 0; 360 0 0" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Rotating wireframe cube (left side, smaller) -->
  <g transform="translate(160,190)">
    <g stroke="#3B82F6" stroke-width="1.3" fill="none" opacity="0.6">
      <polygon points="-20,-20 20,-20 20,20 -20,20"/>
      <polygon points="-10,-30 30,-30 30,10 -10,10"/>
      <line x1="-20" y1="-20" x2="-10" y2="-30"/>
      <line x1="20" y1="-20" x2="30" y2="-30"/>
      <line x1="20" y1="20" x2="30" y2="10"/>
      <line x1="-20" y1="20" x2="-10" y2="10"/>
      <animateTransform attributeName="transform" type="rotate"
        values="360 0 0; 0 0 0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
