<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgCore" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f1730"/>
      <stop offset="55%" stop-color="#070b18"/>
      <stop offset="100%" stop-color="#03050d"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.55">
        <animate attributeName="stop-opacity" values="0.55;0.25;0.55" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ceilFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bgBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Scale wrapper: squashes the original 320-tall scene into the new 200-tall canvas -->
  <g transform="scale(1,0.625)">

  <!-- Base -->
  <rect width="1200" height="320" fill="url(#bgCore)"/>
  <rect width="1200" height="320" fill="url(#coreGlow)"/>

  <!-- Everything below is blurred to read as a soft atmospheric backdrop -->
  <g filter="url(#bgBlur)">

  <!-- Starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="30" r="1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="15" r="1.2" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="45" r="0.8" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="20" r="1" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="35" r="1.3" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="18" r="0.9" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="40" r="1.1" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="22" r="1" opacity="0.65"><animate attributeName="opacity" values="0.65;0.1;0.65" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="48" r="1.2" opacity="0.8"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="70" r="0.7" opacity="0.4"><animate attributeName="opacity" values="0.4;0.05;0.4" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="75" r="0.9" opacity="0.55"><animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="60" r="1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Ceiling grid (converging upward) -->
  <g stroke="url(#ceilFade)" stroke-width="1" opacity="0.55">
    <line x1="600" y1="150" x2="80" y2="0"/>
    <line x1="600" y1="150" x2="260" y2="0"/>
    <line x1="600" y1="150" x2="440" y2="0"/>
    <line x1="600" y1="150" x2="600" y2="0"/>
    <line x1="600" y1="150" x2="760" y2="0"/>
    <line x1="600" y1="150" x2="940" y2="0"/>
    <line x1="600" y1="150" x2="1120" y2="0"/>
    <line x1="300" y1="95" x2="900" y2="95"/>
    <line x1="400" y1="60" x2="800" y2="60"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Floor grid (converging downward) -->
  <g stroke="url(#floorFade)" stroke-width="1.3" opacity="0.85">
    <line x1="600" y1="150" x2="0" y2="320"/>
    <line x1="600" y1="150" x2="150" y2="320"/>
    <line x1="600" y1="150" x2="320" y2="320"/>
    <line x1="600" y1="150" x2="480" y2="320"/>
    <line x1="600" y1="150" x2="600" y2="320"/>
    <line x1="600" y1="150" x2="720" y2="320"/>
    <line x1="600" y1="150" x2="880" y2="320"/>
    <line x1="600" y1="150" x2="1050" y2="320"/>
    <line x1="600" y1="150" x2="1200" y2="320"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="270" x2="1050" y2="270"/>
    <line x1="270" y1="235" x2="930" y2="235"/>
    <line x1="360" y1="208" x2="840" y2="208"/>
    <line x1="440" y1="188" x2="760" y2="188"/>
    <line x1="500" y1="170" x2="700" y2="170"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 16; 0 0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Orbit rings around center -->
  <g transform="translate(600,150)" fill="none" stroke="#3B82F6" opacity="0.5">
    <ellipse rx="120" ry="34" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="120" ry="34" stroke-width="1" stroke="#93C5FD" opacity="0.6" transform="rotate(60)">
      <animateTransform attributeName="transform" type="rotate" values="60;420" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="120" ry="34" stroke-width="1" stroke="#60A5FA" opacity="0.4" transform="rotate(120)">
      <animateTransform attributeName="transform" type="rotate" values="120;480" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Wireframe sphere (icosahedron-style) center -->
  <g transform="translate(600,150)" filter="url(#softGlow)">
    <g stroke="#93C5FD" stroke-width="1.4" fill="none" opacity="0.9">
      <circle r="55"/>
      <ellipse rx="55" ry="18"/>
      <ellipse rx="55" ry="18" transform="rotate(60)"/>
      <ellipse rx="55" ry="18" transform="rotate(120)"/>
      <ellipse rx="18" ry="55"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="16s" repeatCount="indefinite"/>
    </g>
    <circle r="4" fill="#3B82F6">
      <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Side wireframe cubes for depth -->
  <g transform="translate(190,230)" opacity="0.7">
    <g stroke="#3B82F6" stroke-width="1.2" fill="none">
      <polygon points="-22,-22 22,-22 22,22 -22,22"/>
      <polygon points="-10,-34 34,-34 34,10 -10,10"/>
      <line x1="-22" y1="-22" x2="-10" y2="-34"/>
      <line x1="22" y1="-22" x2="34" y2="-34"/>
      <line x1="22" y1="22" x2="34" y2="10"/>
      <line x1="-22" y1="22" x2="-10" y2="10"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(1010,90)" opacity="0.6">
    <g stroke="#60A5FA" stroke-width="1" fill="none">
      <polygon points="-16,-16 16,-16 16,16 -16,16"/>
      <polygon points="-8,-24 24,-24 24,8 -8,8"/>
      <line x1="-16" y1="-16" x2="-8" y2="-24"/>
      <line x1="16" y1="-16" x2="24" y2="-24"/>
      <line x1="16" y1="16" x2="24" y2="8"/>
      <line x1="-16" y1="16" x2="-8" y2="8"/>
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Floating particles (multi-depth) -->
  <g fill="#60A5FA">
    <circle cx="120" cy="120" r="2.4" opacity="0.8">
      <animate attributeName="cy" values="120;95;120" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="200" r="2" opacity="0.7">
      <animate attributeName="cy" values="200;175;200" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="150" r="1.8" opacity="0.6">
      <animate attributeName="cy" values="150;130;150" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="200" r="1.6" opacity="0.5">
      <animate attributeName="cy" values="200;220;200" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="260" r="2.1" opacity="0.7">
      <animate attributeName="cy" values="260;235;260" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="270" r="1.9" opacity="0.65">
      <animate attributeName="cy" values="270;250;270" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  </g>
  <!-- end blurred backdrop group -->

  <!-- Vignette -->
  <rect width="1200" height="320" fill="url(#vignette)"/>
  </g>
  <!-- end scale wrapper -->

  <!-- Crisp foreground text (not blurred, not scaled) -->
  <text x="600" y="112" text-anchor="middle" font-family="'Segoe UI', 'Fira Code', monospace"
        font-size="40" font-weight="700" fill="#ffffff" filter="url(#textShadow)">
    Hi, I'm Prakash Raj S <tspan font-size="34">👋</tspan>
  </text>
</svg>
